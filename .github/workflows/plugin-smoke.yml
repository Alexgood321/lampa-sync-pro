name: Lampa Sync Pro · plugin smoke
on:
  push:
    branches: [main]
    paths:
      - 'lampa-sync-pro.js'
      - 'tests/*.js'
      - '.github/workflows/plugin-smoke.yml'
  pull_request:
    paths:
      - 'lampa-sync-pro.js'
      - 'tests/*.js'
      - '.github/workflows/plugin-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check lampa-sync-pro.js
      - name: Auth / offline / capture
        run: node tests/plugin_smoke.js
      - name: Cloud card and TorrServer resume
        run: node tests/resume_smoke.js
      - name: Torrent preload / external-player launch safety
        run: node tests/torrent_preload_smoke.js
      - name: Cold TorrServer metadata / single-click retries
        run: node tests/torrent_resume_retry_smoke.js
      - name: Automatic preceding-episode completion (without timecodes)
        run: node tests/auto_episode_complete_smoke.js
      - name: TorrServer TrackTimecode /viewed
        run: node tests/torrserver_viewed_smoke.js
      - name: Foreground REST fallback (no polling)
        run: node tests/auto_sync_smoke.js
      - name: Realtime per-account WebSocket delivery
        run: node tests/realtime_smoke.js
